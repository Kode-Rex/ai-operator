[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = --verbose --cov=. --cov-report=term --cov-report=html

markers =
    unit: unit tests
    integration: integration tests
    slow: tests that take a long time to run
    api: tests that require api access